name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This project targets Winsock, so a plain Linux g++ cannot even parse it
      # (<winsock2.h> does not exist there). The mingw-w64 cross compiler ships
      # the Windows headers, so the check runs against the real target.
      - name: Install mingw-w64 cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64

      - name: Syntax check all sources against the Windows target
        run: |
          status=0
          for f in $(find . -name '*.cpp' -o -name '*.cc'); do
            echo "=== $f"
            x86_64-w64-mingw32-g++ -std=c++17 -fsyntax-only -Wall "$f" || status=1
          done
          exit $status
