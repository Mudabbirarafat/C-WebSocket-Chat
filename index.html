<!doctype html>
<html>
<head><meta charset="utf-8"><title>C++ WebSocket Chat</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.container { width: 100%; max-width: 700px; }
#namePrompt {
  background: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
#namePrompt label {
  font-weight: 600;
  color: #333;
  display: block;
  margin-bottom: 15px;
  font-size: 18px;
}
#namePrompt input {
  width: 100%;
  padding: 12px 15px;
  font-size: 16px;
  border: 2px solid #667eea;
  border-radius: 8px;
  margin-bottom: 15px;
  transition: all 0.3s;
  font-family: inherit;
}
#namePrompt input:focus {
  outline: none;
  border-color: #764ba2;
  box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
}
#joinBtn {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
#joinBtn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
}
#chatArea {
  background: white;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  height: 700px;
}
.chat-header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 20px;
  border-radius: 12px 12px 0 0;
  text-align: center;
  font-size: 20px;
  font-weight: 700;
}
#log {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  background: #f9f9f9;
}
#log::-webkit-scrollbar {
  width: 8px;
}
#log::-webkit-scrollbar-track {
  background: #f0f0f0;
}
#log::-webkit-scrollbar-thumb {
  background: #667eea;
  border-radius: 4px;
}
#log::-webkit-scrollbar-thumb:hover {
  background: #764ba2;
}
.system {
  color: #888;
  font-style: italic;
  text-align: center;
  padding: 10px;
  margin: 10px 0;
  font-size: 13px;
}
.msg {
  margin: 12px 0;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  animation: slideIn 0.3s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-content {
  display: flex;
  align-items: baseline;
  flex: 1;
}
.nick {
  font-weight: 700;
  margin-right: 8px;
  padding: 4px 8px;
  border-radius: 4px;
  color: white;
  font-size: 14px;
  min-width: 80px;
  text-align: center;
}
.ts {
  color: #aaa;
  font-size: 12px;
  margin-left: auto;
  white-space: nowrap;
  padding-left: 10px;
}
#input {
  display: flex;
  gap: 8px;
  padding: 15px;
  border-top: 1px solid #e0e0e0;
  background: white;
  border-radius: 0 0 12px 12px;
}
#msg {
  flex: 1;
  padding: 10px 15px;
  font-size: 14px;
  border: 2px solid #e0e0e0;
  border-radius: 8px;
  transition: border-color 0.3s;
}
#msg:focus {
  outline: none;
  border-color: #667eea;
}
#send {
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: transform 0.2s;
}
#send:hover {
  transform: translateY(-2px);
}
#send:active {
  transform: translateY(0);
}
</style>
</head>
<body>
<div class="container">
  <div id="namePrompt">
    <label>Enter your username:</label>
    <input id="username" type="text" placeholder="Your name..." autofocus>
    <button id="joinBtn">Join Chat</button>
  </div>
  <div id="chatArea" style="display:none;">
    <div class="chat-header">💬 C++ WebSocket Chat</div>
    <div id="log"></div>
    <div id="input"><input id="msg" type="text" placeholder="Type your message..."><button id="send">Send</button></div>
  </div>
</div>
<script>
let ws;
let username = '';
const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2', '#F8B195', '#A8E6CF'];
const userColors = {};

function getUserColor(nick) {
  if (!userColors[nick]) {
    const colorIndex = Object.keys(userColors).length % colors.length;
    userColors[nick] = colors[colorIndex];
  }
  return userColors[nick];
}

function addLog(html){
  const d=document.getElementById('log');
  const wrap=document.createElement('div');
  wrap.innerHTML=html;
  d.appendChild(wrap);
  d.scrollTop=d.scrollHeight;
}

function start(){
  ws=new WebSocket('ws://'+location.hostname+':8080');
  ws.onopen=()=>{
    ws.send(JSON.stringify({type:'setname',name:username}));
  };
  ws.onmessage=(ev)=>{
    try{
      const j=JSON.parse(ev.data);
      if(j.type==='system') {
        addLog('<div class="system">✓ '+j.msg+'</div>');
      } else if(j.type==='message'){
        const time=new Date(j.serverTs*1000).toLocaleTimeString();
        const nick = j.nick||'Anon';
        const color = getUserColor(nick);
        addLog('<div class="msg"><div class="msg-content"><span class="nick" style="background:'+color+'">'+(j.nick||'Anon')+'</span><span style="color:#333;">'+j.msg+'</span></div><span class="ts">'+time+'</span></div>');
      }
      else addLog('<div>'+ev.data+'</div>');
    }catch(e){ addLog('<div>'+ev.data+'</div>'); }
  };
  ws.onclose=()=>addLog('<div class="system">⚠ Disconnected</div>');
  ws.onerror=(e)=>console.error(e);
}

document.getElementById('joinBtn').addEventListener('click',()=>{
  const u=document.getElementById('username').value.trim();
  if(!u){alert('Please enter a username');return;}
  username=u;
  document.getElementById('namePrompt').style.display='none';
  document.getElementById('chatArea').style.display='flex';
  start();
});

document.getElementById('username').addEventListener('keypress',(e)=>{
  if(e.key==='Enter'){document.getElementById('joinBtn').click();}
});

document.getElementById('send').addEventListener('click',()=>{
  const v=document.getElementById('msg').value; 
  if(!v) return;
  if(ws && ws.readyState===WebSocket.OPEN){ 
    ws.send(v); 
    document.getElementById('msg').value=''; 
    document.getElementById('msg').focus();
  }
});

document.getElementById('msg').addEventListener('keypress',(e)=>{
  if(e.key==='Enter'){document.getElementById('send').click();}
});
</script>
</body></html>
